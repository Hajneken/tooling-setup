[metadata]
name = "logs"
description = "A channel to find and select text from files"
requirements = ["echo","bat", "oc", "jq"]

[source]
command = 'oc logs "$(oc get pods -o name | grep -E "^pod/sith-hubspot-.{10}-.{5}$" )"'

[preview]
command = "echo '{}'| jq . | bat -n --color=always --language json"
env = { BAT_THEME = "Catppuccin Mocha" }
# command = "bat -n --color=always '{}'"

[keybindings]
ctrl-e = "actions:open"

[actions.open]
description = "Opens the selected entries with the default application"
command = "echo '{}' > /tmp/tv-logs.txt && code /tmp/tv-logs.txt"
mode = "execute"


[actions.edit]
description = "Open file in editor at line"
command = "${EDITOR:-vim} '+{strip_ansi|split:\\::1}' '{strip_ansi|split:\\::0}'"
shell = "bash"
mode = "execute"

[ui]
preview_panel = { size = 60, scrollbar = true }

